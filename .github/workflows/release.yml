name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.1.0
#   git push origin v1.1.0
#
# This keeps releases deliberate and separate from every-day pushes to
# main (handled by ci-build.yml instead). A release:
#   1. Builds the release APK (per-ABI, so downloads stay small)
#   2. Computes each APK's SHA-256
#   3. Publishes a GitHub Release with the APKs attached (permanent,
#      public, unauthenticated download URLs)
#   4. Regenerates version.json pointing at the new release + checksum
#      and commits it back to main, which is what the app polls
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version info from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"        # e.g. v1.1.0
          VERSION_NAME="${TAG#v}"                # e.g. 1.1.0
          # versionCode: monotonic build number. Uses the run number so it
          # always increases even across re-tags, matching Android's
          # requirement that versionCode strictly increase between releases.
          VERSION_CODE="${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APKs (per-ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --dart-define=API_BASE_URL=https://envyenhance-api-9j77.onrender.com

      - name: Compute checksums
        id: checksums
        run: |
          cd build/app/outputs/flutter-apk
          echo "Generated APKs:"
          ls -la *.apk
          # arm64-v8a covers the overwhelming majority of real Android
          # devices in use today, so it's the one version.json points at.
          # (armeabi-v7a and x86_64 APKs are still attached to the release
          # for anyone who needs them, just not auto-updated to.)
          SHA=$(sha256sum app-arm64-v8a-release.apk | cut -d' ' -f1)
          echo "arm64_sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/*.apk

      - name: Write version.json
        run: |
          cat > version.json << EOF
          {
            "versionName": "${{ steps.version.outputs.name }}",
            "versionCode": ${{ steps.version.outputs.code }},
            "releaseNotes": "See the GitHub Release for full notes.",
            "minSupportedVersionCode": 1,
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/app-arm64-v8a-release.apk",
            "apkSha256": "${{ steps.checksums.outputs.arm64_sha256 }}"
          }
          EOF
          cat version.json

      - name: Commit version.json back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump version.json to ${{ steps.version.outputs.tag }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
