name: envyenhance_app
description: EnvyEnhance mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # Local storage (cart cache, tokens, prefs)
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Images
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1

  # Rich content rendering (blog posts authored via admin's rich text editor
  # are stored as raw HTML, not the legacy structured block array)
  flutter_html: ^3.0.0-beta.2

  # UI
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Utils
  collection: ^1.18.0
  logger: ^2.4.0

  # Push notifications. Version numbers deliberately loose (^) rather than
  # pinned — firebase_core and firebase_messaging release in lockstep and
  # must stay mutually compatible; run `flutter pub upgrade` after adding
  # these so pub resolves whatever's currently compatible rather than
  # relying on versions guessed at write-time.
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.0

  # In-app update: version.json fetch, APK download, checksum verify, install
  package_info_plus: ^8.3.0
  http: ^1.2.2
  path_provider: ^2.1.4
  open_filex: ^4.7.0
  crypto: ^3.0.6
  convert: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
