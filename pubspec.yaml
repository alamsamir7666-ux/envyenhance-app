name: envyenhance_app
description: EnvyEnhance mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local storage (cart cache, tokens, prefs)
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Images
  cached_network_image: ^3.3.1

  # UI
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Utils
  collection: ^1.18.0
  logger: ^2.4.0

  # In-app update: version.json fetch, APK download, checksum verify, install
  package_info_plus: ^8.3.0
  http: ^1.2.2
  path_provider: ^2.1.4
  open_filex: ^4.7.0
  crypto: ^3.0.6
  convert: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
